name: Docs

# This repository is a documentation site: the built site IS the product.
# Every push to main and every PR builds the docs strictly (the test); pushes
# to main additionally deploy the site to GitHub Pages.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Per-ref group: a newer push to the same PR supersedes the older run. Runs on
# main are never cancelled. The Pages deployment has its own group on the deploy
# job, so a queued PR build can no longer displace a pending deploy.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build docs (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history for the git-revision-date plugin

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build docs (strict)
        run: |
          set -euo pipefail
          # --locked fails the build if uv.lock is out of date with
          # pyproject.toml instead of silently re-resolving.
          uv run --locked --group docs mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy docs to Pages
    runs-on: ubuntu-latest
    # Nothing is published unless the page, script and tool checks pass too.
    needs: [build, powershell, javascript, site]
    timeout-minutes: 10
    # Pushes to main publish automatically; workflow_dispatch republishes on
    # demand without needing an empty commit.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    permissions:
      pages: write
      id-token: write
    # Only one deployment at a time; never cancel one that has started.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Lint YAML
        run: |
          set -euo pipefail
          # Whole repo, not just .github - mkdocs.yml is the file most likely to
          # be hand-edited. .yamllint.yml scopes the walk via yaml-files and
          # ignore-from-file.
          python3 -m pip install --user --quiet yamllint==1.38.0
          python3 -m yamllint --strict -c .yamllint.yml .

  actionlint:
    name: Action lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          set -euo pipefail
          # Pinned release, verified against the published checksum - the same
          # supply-chain posture as the SHA-pinned actions above.
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

  powershell:
    name: PowerShell (format, analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install PSScriptAnalyzer and Pester
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force

      - name: Invoke-Formatter and Invoke-ScriptAnalyzer on script files
        run: ./tools/Test-PowerShellStyle.ps1

      - name: Invoke-Formatter and Invoke-ScriptAnalyzer on documentation code blocks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ps_snippets.py

      - name: Pester
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/ps'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  javascript:
    name: JavaScript (lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dev dependencies
        run: |
          set -euo pipefail
          # No browser download here: only the site job needs one, and it uses
          # the Chrome that ships on the runner.
          PUPPETEER_SKIP_DOWNLOAD=1 npm ci

      - name: Lint
        run: |
          set -euo pipefail
          npm run lint

      - name: Test
        run: |
          set -euo pipefail
          npm test

  site:
    name: Built site (vnu, pa11y WCAG 2 AAA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history for the git-revision-date plugin

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dev dependencies
        run: |
          set -euo pipefail
          PUPPETEER_SKIP_DOWNLOAD=1 npm ci

      - name: Build docs (strict)
        run: |
          set -euo pipefail
          uv run --locked --group docs mkdocs build --strict

      - name: Nu HTML Checker on every page
        run: |
          set -euo pipefail
          npm run html

      - name: pa11y WCAG 2 AAA on every page, light and dark
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome)" npm run a11y
